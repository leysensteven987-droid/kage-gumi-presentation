<!doctype html>
<html lang="en" data-theme="dim" data-theme-mode="auto">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Raiden · restricted</title>
<meta name="theme-color" id="theme-color" content="#121826">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='7' fill='%23121826'/><g fill='none' stroke-width='3.625' stroke-linecap='round'><path d='M 20.125 6.875 L 12.375 10.4375' stroke='%238dafee'/><path d='M 21.875 12.75 L 10.75 17.9375' stroke='%235b8def'/><path d='M 23 18.25 L 9.125 25.125' stroke='%232563eb'/></g></svg>">
<script>
/* Theme, resolved before first paint - the kage-gumi.com landing's logic and its
   localStorage key, so a choice made there carries in here. Order: the visitor's
   stored choice > OS dark preference > local clock (dim 18:00-08:00). */
(function () {
  var KEY = 'kg-landing-theme', d = document.documentElement;
  function stored() { try { var v = localStorage.getItem(KEY); return (v === 'light' || v === 'dim') ? v : null; } catch (e) { return null; } }
  function osDark() { try { return window.matchMedia('(prefers-color-scheme: dark)').matches; } catch (e) { return false; } }
  function clockDim() { var h = new Date().getHours(); return h >= 18 || h < 8; }
  function resolve() { var s = stored(); return s || ((osDark() || clockDim()) ? 'dim' : 'light'); }
  function apply() {
    var t = resolve();
    d.setAttribute('data-theme', t);
    d.setAttribute('data-theme-mode', stored() ? 'manual' : 'auto');
    var m = document.getElementById('theme-color');
    if (m) m.setAttribute('content', t === 'dim' ? '#121826' : '#eff3f8');
    return t;
  }
  window.KGTheme = { KEY: KEY, stored: stored, resolve: resolve, apply: apply };
  apply();
})();
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&family=Noto+Serif+JP:wght@500;700&display=swap" rel="stylesheet">
<style>
  /* KG SaaS-slate veils - the kage-gumi.com landing's tokens (branding/wallpapers/
     render-slate.mjs <- frontend/index.html --kg-*). One accent, the house-blue ramp.
     Amber is the error state, as in the app. Nothing glows; kanji are seals. */
  :root {
    --sans:  'Inter', 'Segoe UI', system-ui, sans-serif;
    --mono:  'IBM Plex Mono', ui-monospace, Consolas, monospace;
    --serif: 'Noto Serif JP', 'Yu Mincho', serif;
    --ramp-1: #8dafee; --ramp-2: #5b8def; --ramp-3: #2563eb;
    --ease: cubic-bezier(.2,.7,.2,1);
  }
  html[data-theme="dim"] {
    color-scheme: dark;
    --page: #121826; --deep: #0d1320; --card: #1a2130; --card-alt: #1f2735;
    --border: #2c3548; --border-card: #333d52; --border-strong: #3f4a61;
    --text: #e6ebf3; --body: #d5dce8; --muted: #a4b0c4; --dim: #8593a9; --faint: #6f7d94;
    --accent: #5b8def; --accent-ink: #8dafee; --accent-wash: rgba(91,141,239,.10);
    --btn: #2563eb; --btn-hover: #3a73ee; --btn-ink: #ffffff;
    --field: #121826;
    --warn: #d99a2b; --warn-wash: rgba(217,154,43,.10);
    --seal-red: #e0644a;   /* the house seal: the 影 card seal only */
    --grid-minor: rgba(44,53,72,.55); --grid-major: rgba(63,74,97,.55);
    --shadow: 0 1px 2px rgba(0,0,0,.28), 0 12px 32px -16px rgba(0,0,0,.55);
  }
  html[data-theme="light"] {
    color-scheme: light;
    --page: #eff3f8; --deep: #e6ecf3; --card: #f9fbfd; --card-alt: #ffffff;
    --border: #d9e1ec; --border-card: #dde4ee; --border-strong: #cbd5e1;
    --text: #0f172a; --body: #1e293b; --muted: #556377; --dim: #5b687c; --faint: #94a3b8;
    --accent: #2563eb; --accent-ink: #2563eb; --accent-wash: rgba(37,99,235,.07);
    --btn: #2563eb; --btn-hover: #1d4fd8; --btn-ink: #ffffff;
    --field: #ffffff;
    --warn: #9c6208; --warn-wash: rgba(156,98,8,.08);
    --seal-red: #a8331f;   /* the house seal: the 影 card seal only */
    --grid-minor: rgba(203,213,225,.45); --grid-major: rgba(148,163,184,.30);
    --shadow: 0 1px 2px rgba(15,23,42,.05), 0 12px 32px -18px rgba(15,23,42,.16);
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }
  html { min-height: 100%; }
  ::selection { background: var(--accent-wash); color: var(--text); }
  body {
    background-color: var(--page);
    background-image: linear-gradient(180deg, var(--page) 0%, var(--page) 50%, var(--deep) 100%);
    color: var(--text);
    font-family: var(--sans);
    -webkit-font-smoothing: antialiased;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 88px 24px 40px;
    position: relative;
    overflow-x: hidden;
    transition: background-color .35s ease, color .35s ease;
  }
  /* blueprint ground: the landing's drafting grid, masked to fade out downward */
  body::before {
    content: "";
    position: absolute; top: 0; left: 0; right: 0; height: 100vh;
    z-index: -1; pointer-events: none;
    background-image:
      linear-gradient(var(--grid-major) 1px, transparent 1px),
      linear-gradient(90deg, var(--grid-major) 1px, transparent 1px),
      linear-gradient(var(--grid-minor) 1px, transparent 1px),
      linear-gradient(90deg, var(--grid-minor) 1px, transparent 1px);
    background-size: 160px 160px, 160px 160px, 32px 32px, 32px 32px;
    background-position: calc(50% + 0.5px) -1px;
    -webkit-mask-image: radial-gradient(70% 60% at 50% 0%, #000 0%, rgba(0,0,0,.35) 55%, transparent 100%);
            mask-image: radial-gradient(70% 60% at 50% 0%, #000 0%, rgba(0,0,0,.35) 55%, transparent 100%);
  }

  /* ── top bar: wayfinder left, theme switch right ── */
  .home {
    position: absolute; top: 22px; left: 24px; z-index: 5;
    display: inline-flex; align-items: center; gap: 8px;
    height: 36px; padding: 0 4px;
    font-family: var(--mono); font-size: 12px; font-weight: 500; letter-spacing: .06em;
    color: var(--dim); text-decoration: none;
    border-radius: 8px;
    transition: color .2s ease;
  }
  .home .arw { transition: transform .3s var(--ease); }
  .home:hover, .home:focus-visible { color: var(--text); outline: none; }
  .home:hover .arw, .home:focus-visible .arw { transform: translateX(-3px); }
  .home:focus-visible { box-shadow: 0 0 0 2px var(--page), 0 0 0 4px var(--accent); }
  .theme { position: absolute; top: 22px; right: 24px; display: flex; align-items: center; gap: 6px; z-index: 5; }
  .theme-btn, .theme-auto {
    font-family: var(--sans); color: var(--muted);
    background: var(--card); border: 1px solid var(--border-card); box-shadow: var(--shadow);
    cursor: pointer;
    transition: color .2s ease, border-color .2s ease, background-color .2s ease;
  }
  .theme-btn { width: 36px; height: 36px; border-radius: 10px; display: inline-flex; align-items: center; justify-content: center; }
  .theme-btn svg { width: 17px; height: 17px; }
  .theme-btn .i-sun { display: none; }
  html[data-theme="dim"] .theme-btn .i-sun  { display: block; }
  html[data-theme="dim"] .theme-btn .i-moon { display: none; }
  .theme-auto { height: 36px; padding: 0 12px; border-radius: 10px; font-size: 12px; font-weight: 500; letter-spacing: .02em; }
  html[data-theme-mode="auto"] .theme-auto { display: none; }
  .theme-btn:hover, .theme-auto:hover, .theme-btn:focus-visible, .theme-auto:focus-visible { color: var(--text); border-color: var(--border-strong); outline: none; }
  .theme-btn:focus-visible, .theme-auto:focus-visible { box-shadow: 0 0 0 2px var(--page), 0 0 0 4px var(--accent); }

  /* ── stage ── */
  .stage { width: 100%; max-width: 440px; margin: auto 0; display: flex; flex-direction: column; align-items: center; }
  .mark {
    width: 56px; height: 56px; border-radius: 15px;
    background: var(--card); border: 1px solid var(--border-card); box-shadow: var(--shadow);
    display: flex; align-items: center; justify-content: center;
  }
  .mark svg { width: 37px; height: 37px; overflow: visible; }
  .mark path { fill: none; stroke-width: 3.625; stroke-linecap: round; }
  .brand {
    margin-top: 16px;
    font-family: var(--mono); font-size: 11.5px; font-weight: 500;
    letter-spacing: .24em; text-transform: uppercase; color: var(--dim);
  }
  .jp { font-family: var(--serif); font-weight: 700; letter-spacing: .12em; text-transform: none; }

  /* ── the card ── */
  .card {
    position: relative; overflow: hidden; isolation: isolate;
    width: 100%; margin-top: 28px;
    padding: 30px 32px 28px;
    background: var(--card); border: 1px solid var(--border-card); border-radius: 14px;
    box-shadow: var(--shadow);
    transition: border-color .35s ease, background-color .35s ease, box-shadow .35s ease;
  }
  /* the ramp rule along the top edge, drawn while the form is in use */
  .card::before {
    content: ""; position: absolute; top: 0; left: 0; right: 0; height: 2px;
    background: linear-gradient(90deg, var(--ramp-1), var(--ramp-2) 50%, var(--ramp-3));
    transform: scaleX(0); transform-origin: left; transition: transform .5s var(--ease);
  }
  .card:focus-within { border-color: color-mix(in srgb, var(--accent) 35%, var(--border-card)); }
  .card:focus-within::before { transform: scaleX(1); }
  /* the kanji seal, stamped in the corner: the one seal-red moment on the gate */
  .card-seal {
    position: absolute; top: 26px; right: 26px;
    width: 34px; height: 34px;
    display: flex; align-items: center; justify-content: center;
    font-family: var(--serif); font-weight: 700; font-size: 17px; line-height: 1;
    color: var(--seal-red);
    border: 1px solid color-mix(in srgb, var(--seal-red) 55%, var(--border-strong));
    border-radius: 5px 7px 4px 7px; transform: rotate(-2.5deg);
    user-select: none; pointer-events: none;
  }
  .eyebrow {
    display: flex; align-items: center; gap: 10px; padding-right: 48px;
    font-family: var(--mono); font-size: 11.5px; font-weight: 500;
    letter-spacing: .16em; text-transform: uppercase; color: var(--accent-ink);
  }
  .ico {
    width: 30px; height: 30px; flex: none; border-radius: 8px;
    display: inline-flex; align-items: center; justify-content: center;
    background: var(--accent-wash); color: var(--accent-ink);
  }
  .ico svg { width: 16px; height: 16px; }
  h1 {
    font-family: var(--sans); font-weight: 600; font-size: 30px; line-height: 1.15;
    letter-spacing: -0.02em; color: var(--text);
    margin: 22px 0 12px;
  }
  .sub { font-size: 15px; line-height: 1.65; color: var(--muted); }
  .sub a {
    color: var(--accent-ink); font-weight: 500; text-decoration: none;
    border-bottom: 1px solid color-mix(in srgb, var(--accent) 40%, transparent);
    overflow-wrap: anywhere;
    transition: border-color .2s ease;
  }
  .sub a:hover, .sub a:focus-visible { border-bottom-color: var(--accent); outline: none; }
  .sub a:focus-visible { border-radius: 2px; box-shadow: 0 0 0 2px var(--card), 0 0 0 4px var(--accent); }

  /* ── the form ── */
  form { margin-top: 26px; display: flex; flex-direction: column; }
  .lbl { font-size: 13px; font-weight: 500; color: var(--body); margin-bottom: 8px; }
  .field { position: relative; }
  input {
    width: 100%; height: 48px;
    padding: 0 48px 0 14px;
    font-family: var(--mono); font-size: 15px; letter-spacing: .06em;
    color: var(--text); background: var(--field);
    border: 1px solid var(--border-strong); border-radius: 10px;
    outline: none;
    transition: border-color .15s ease, box-shadow .15s ease, background-color .35s ease;
  }
  input::placeholder { color: var(--faint); letter-spacing: .02em; font-family: var(--sans); font-size: 14px; }
  input:focus { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent); }
  .peek {
    position: absolute; top: 6px; right: 6px; width: 36px; height: 36px;
    display: inline-flex; align-items: center; justify-content: center;
    color: var(--dim); background: transparent; border: 0; border-radius: 8px; cursor: pointer;
    transition: color .2s ease, background-color .2s ease;
  }
  .peek svg { width: 18px; height: 18px; }
  .peek .i-hide { display: none; }
  .peek[aria-pressed="true"] .i-show { display: none; }
  .peek[aria-pressed="true"] .i-hide { display: block; }
  .peek:hover { color: var(--text); background: var(--accent-wash); }
  .peek:focus-visible { outline: none; color: var(--text); box-shadow: 0 0 0 2px var(--accent); }
  button.go {
    margin-top: 14px; height: 46px;
    display: inline-flex; align-items: center; justify-content: center; gap: 8px;
    font-family: var(--sans); font-size: 14.5px; font-weight: 600; letter-spacing: .01em;
    color: var(--btn-ink); background: var(--btn);
    border: 0; border-radius: 10px; cursor: pointer;
    transition: background-color .2s ease;
  }
  button.go .arw { transition: transform .3s var(--ease); }
  button.go:hover { background: var(--btn-hover); }
  button.go:hover .arw { transform: translateX(3px); }
  button.go:focus-visible { outline: none; box-shadow: 0 0 0 2px var(--card), 0 0 0 4px var(--accent); }
  button.go:disabled { cursor: progress; opacity: .7; }
  button.go:disabled .arw { display: none; }
  /* error: amber, stated in words and shown on the field */
  .err {
    display: none; align-items: flex-start; gap: 10px;
    margin-top: 14px; padding: 11px 13px;
    font-size: 13.5px; line-height: 1.5; color: var(--body);
    background: var(--warn-wash);
    border: 1px solid color-mix(in srgb, var(--warn) 45%, transparent);
    border-radius: 10px;
  }
  .err svg { width: 16px; height: 16px; flex: none; margin-top: 2px; color: var(--warn); }
  .err b { font-weight: 600; color: var(--text); }
  form.bad .err { display: flex; }
  form.bad input { border-color: var(--warn); box-shadow: 0 0 0 1px var(--warn); }


  /* entrance: the 彡 strokes draw, the card settles. JS off or reduced motion = at rest */
  html.preanim .mark, html.preanim .brand, html.preanim .card { opacity: 0; }
  html.preanim .mark  { transform: translateY(8px); }
  html.preanim .brand { transform: translateY(8px); }
  html.preanim .card  { transform: translateY(14px); }
  html.preanim .mark path { stroke-dasharray: 1; stroke-dashoffset: 1; transition: stroke-dashoffset .55s cubic-bezier(.6,0,.3,1); }
  html.preanim .mark, html.preanim .brand, html.preanim .card {
    transition: opacity .6s ease, transform .6s var(--ease), border-color .35s ease, background-color .35s ease, box-shadow .35s ease;
  }
  html.preanim.play .mark  { opacity: 1; transform: none; transition-delay: .05s; }
  html.preanim.play .mark path { stroke-dashoffset: 0; }
  html.preanim.play .mark path:nth-child(1) { transition-delay: .25s; }
  html.preanim.play .mark path:nth-child(2) { transition-delay: .40s; }
  html.preanim.play .mark path:nth-child(3) { transition-delay: .55s; }
  html.preanim.play .brand { opacity: 1; transform: none; transition-delay: .18s; }
  html.preanim.play .card  { opacity: 1; transform: none; transition-delay: .28s; }
  html.preanim.settled * { transition-delay: 0s !important; }

  @media (max-width: 560px) {
    body { padding: 76px 16px 28px; }
    .home { top: 16px; left: 14px; }
    .theme { top: 16px; right: 16px; }
    .mark { width: 50px; height: 50px; border-radius: 13px; }
    .mark svg { width: 33px; height: 33px; }
    .card { margin-top: 22px; padding: 24px 20px 22px; }
    .card-seal { top: 20px; right: 18px; }
    h1 { font-size: 26px; margin: 20px 0 10px; }
    .sub { font-size: 14.5px; }
    form { margin-top: 22px; }
  }
  @media (prefers-reduced-motion: reduce) {
    * { transition: none !important; animation: none !important; }
  }
</style>
</head>
<body>
  <a class="home" href="/"><span class="arw" aria-hidden="true">&larr;</span>kage-gumi.com</a>
  <div class="theme">
    <button type="button" class="theme-auto" id="theme-auto" aria-label="Follow the system and time of day again">Auto</button>
    <button type="button" class="theme-btn" id="theme-btn" aria-label="Switch theme">
      <svg class="i-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20.5 14.2A8.5 8.5 0 0 1 9.8 3.5a8.5 8.5 0 1 0 10.7 10.7z"/></svg>
      <svg class="i-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2.5v2M12 19.5v2M4.6 4.6l1.4 1.4M18 18l1.4 1.4M2.5 12h2M19.5 12h2M4.6 19.4L6 18M18 6l1.4-1.4"/></svg>
    </button>
  </div>

  <main class="stage">
    <div class="mark" aria-hidden="true"><svg viewBox="0 0 32 32"><path pathLength="1" d="M 20.125 6.875 L 12.375 10.4375" stroke="#8dafee"/><path pathLength="1" d="M 21.875 12.75 L 10.75 17.9375" stroke="#5b8def"/><path pathLength="1" d="M 23 18.25 L 9.125 25.125" stroke="#2563eb"/></svg></div>
    <div class="brand"><span class="jp">影組</span> · Shadow Crew</div>

    <section class="card" aria-labelledby="gate-h">
      <span class="card-seal" aria-hidden="true">雷</span>
      <div class="eyebrow">
        <span class="ico"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="4.5" y="10.5" width="15" height="10" rx="2"/><path d="M8 10.5V7.5a4 4 0 0 1 8 0v3"/></svg></span>
        Sealed
      </div>
      <h1 id="gate-h">Enter the fold</h1>
      <p class="sub">The Appliance Tech is sealed. Enter the passphrase to open it.</p>
      <form id="f" novalidate>
        <label class="lbl" for="pw">Passphrase</label>
        <div class="field">
          <input id="pw" type="password" autocomplete="current-password" placeholder="Enter the passphrase" aria-describedby="err" autofocus>
          <button type="button" class="peek" id="peek" aria-pressed="false" aria-label="Show passphrase" title="Show passphrase">
            <svg class="i-show" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg>
            <svg class="i-hide" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 3l18 18"/><path d="M10.6 5.1A10.8 10.8 0 0 1 12 5c6.5 0 10 7 10 7a17.6 17.6 0 0 1-3.2 4.2M6.6 6.6C3.9 8.3 2 12 2 12s3.5 7 10 7a10 10 0 0 0 5.4-1.6"/><path d="M9.9 9.9a3 3 0 0 0 4.2 4.2"/></svg>
          </button>
        </div>
        <button id="go" class="go" type="submit"><span id="go-l">Unseal</span><span class="arw" aria-hidden="true">&rarr;</span></button>
        <div class="err" role="alert"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3.5 2.5 20h19L12 3.5z"/><path d="M12 10v4.5M12 17.3v.2"/></svg><span id="err"></span></div>
      </form>
    </section>

const b64=s=>{const b=atob(s),a=new Uint8Array(b.length);for(let i=0;i<b.length;i++)a[i]=b.charCodeAt(i);return a;};
async function unseal(pw){
  const km=await crypto.subtle.importKey('raw',new TextEncoder().encode(pw),'PBKDF2',false,['deriveKey']);
  const key=await crypto.subtle.deriveKey({name:'PBKDF2',salt:b64(SALT),iterations:ITER,hash:'SHA-256'},
    km,{name:'AES-GCM',length:256},false,['decrypt']);
  const pt=await crypto.subtle.decrypt({name:'AES-GCM',iv:b64(IV)},key,b64(CT));
  return new TextDecoder().decode(pt);
}
const f=document.getElementById('f'),err=document.getElementById('err'),go=document.getElementById('go');
/* UI chrome (theme switch, show/hide, entrance) lives in one closure so it adds no
   globals the unsealed page could collide with, and is torn down before the swap. */
const gateUi=(function(){
  var root=document.documentElement, T=window.KGTheme, timers=[], offs=[];
  var btn=document.getElementById('theme-btn'), autoBtn=document.getElementById('theme-auto');
  function label(){
    var t=root.getAttribute('data-theme'), next=t==='dim'?'light':'dim', mode=root.getAttribute('data-theme-mode');
    var l='Theme: '+t+(mode==='auto'?' (automatic)':'')+'. Switch to '+next;
    btn.setAttribute('aria-label',l); btn.setAttribute('title',l);
  }
  if(T&&btn){
    btn.addEventListener('click',function(){
      var next=root.getAttribute('data-theme')==='dim'?'light':'dim';
      try{localStorage.setItem(T.KEY,next);}catch(e){}
      T.apply(); label();
    });
    autoBtn.addEventListener('click',function(){
      try{localStorage.removeItem(T.KEY);}catch(e){}
      T.apply(); label(); btn.focus();
    });
    var onOs=function(){ if(!T.stored()){ T.apply(); label(); } };
    var mq=window.matchMedia&&window.matchMedia('(prefers-color-scheme: dark)');
    if(mq){ if(mq.addEventListener){ mq.addEventListener('change',onOs); offs.push(function(){mq.removeEventListener('change',onOs);}); }
            else if(mq.addListener){ mq.addListener(onOs); offs.push(function(){mq.removeListener(onOs);}); } }
    timers.push(setInterval(onOs,60000));
    var onStore=function(e){ if(e.key===T.KEY){ T.apply(); label(); } };
    window.addEventListener('storage',onStore); offs.push(function(){window.removeEventListener('storage',onStore);});
    label();
  }
  var pw=document.getElementById('pw'), peek=document.getElementById('peek');
  peek.addEventListener('click',function(){
    var show=pw.type==='password'; pw.type=show?'text':'password';
    peek.setAttribute('aria-pressed',show?'true':'false');
    var l=show?'Hide passphrase':'Show passphrase'; peek.setAttribute('aria-label',l); peek.setAttribute('title',l);
    pw.focus();
  });
  pw.addEventListener('input',function(){ f.classList.remove('bad'); });
  if(!(window.matchMedia&&window.matchMedia('(prefers-reduced-motion: reduce)').matches)){
    root.classList.add('preanim');
    var played=false, play=function(){ if(played)return; played=true;
      requestAnimationFrame(function(){ root.classList.add('play'); timers.push(setTimeout(function(){root.classList.add('settled');},1500)); }); };
    if(document.fonts&&document.fonts.ready){ document.fonts.ready.then(play); timers.push(setTimeout(play,700)); } else play();
  }
  return {
    busy:function(on){ document.getElementById('go-l').textContent=on?'Unsealing\u2026':'Unseal'; go.setAttribute('aria-busy',on?'true':'false'); },
    fail:function(msg){ f.classList.add('bad'); err.innerHTML=msg; },
    teardown:function(){ timers.forEach(function(t){clearInterval(t);clearTimeout(t);}); offs.forEach(function(o){o();}); }
  };
})();
f.addEventListener('submit',async e=>{
  e.preventDefault();err.textContent='';f.classList.remove('bad');
  if(!document.getElementById('pw').value){ gateUi.fail('<b>Enter the passphrase</b> to open this page.'); document.getElementById('pw').focus(); return; }
  go.disabled=true;gateUi.busy(true);
  try{
    const html=await unseal(document.getElementById('pw').value);
    gateUi.teardown();
    document.open();document.write(html);document.close();
  }catch(_){ gateUi.fail('<b>Wrong passphrase.</b> Check it and try again.');go.disabled=false;gateUi.busy(false);
    const p=document.getElementById('pw');p.value='';p.focus(); }
});
</script>
